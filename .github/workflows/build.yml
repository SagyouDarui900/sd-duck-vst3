name: Build SD-Duck VST3

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target SD-Duck_VST3

      - name: Prepare Artifact
        shell: pwsh
        run: |
          $vst3Path = "build/SD-Duck_artefacts/Release/VST3/SD-Duck.vst3"
          if (-not (Test-Path $vst3Path)) {
            $vst3Path = (Get-ChildItem -Path "build" -Recurse -Filter "SD-Duck.vst3").FullName
          }
          New-Item -ItemType Directory -Force -Path "dist/SD-Duck"
          Copy-Item -Recurse -Force $vst3Path "dist/SD-Duck/"
          Copy-Item "README.md" "dist/SD-Duck/"
          Copy-Item "LICENSE" "dist/SD-Duck/"
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "SD-Duck-${tag}-win64-vst3.zip"
          Compress-Archive -Path "dist/SD-Duck/*" -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Duck-VST3-Windows
          path: ${{ env.ZIP_NAME }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
